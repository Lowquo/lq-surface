name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  js:
    name: Typecheck, build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Toolchain versions
        run: |
          node --version
          npm --version
      # Deterministic install from the committed package-lock.json. Fails if the
      # lockfile is missing or out of sync with any workspace package.json.
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # The build must not modify tracked files (e.g. a stale lockfile rewrite).
      - name: Verify clean working tree
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
