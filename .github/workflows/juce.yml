name: JUCE example
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: juce-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Must match the JUCE version the example is developed and verified against.
  JUCE_VERSION: '9.0.4'
  # Commit of refs/tags/9.0.4 (git ls-remote https://github.com/juce-framework/JUCE).
  JUCE_COMMIT: 3fb5cbc0340758596dac39f7c8de47d562b4896e
  # Version suggested by JUCE 9.0.4's extras/Build/CMake/FindWebView2.cmake.
  WEBVIEW2_VERSION: '1.0.3485.44'
  # FROZEN plug-in identity (see examples/juce-plugin/CMakeLists.txt). Hosts recognise the plug-in
  # by these values; the bundle checks below fail if a build ever carries different ones.
  EXPECT_BUNDLE_ID: io.lowquo.surface.example
  EXPECT_AU_TYPE: aufx
  EXPECT_AU_SUBTYPE: Lqsf
  EXPECT_AU_MANUFACTURER: Lqoo
  EXPECT_VST3_PROCESSOR_CID: ABCDEF019182FAEB4C716F6F4C717366
  EXPECT_VST3_CONTROLLER_CID: ABCDEF011234ABCD4C716F6F4C717366
  # pluginval (Tracktion, GPLv3 tool; used only to test, never shipped). Pinned release and the
  # SHA-256 of each zip as verified by the maintainer workflow (macOS build: notarized Developer ID,
  # Tracktion Software Corp YLB5W3GE5T).
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
jobs:
  plugin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AU + VST3)
            os: macos-latest
          - name: Windows (VST3 + WebView2)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and package the web UI (deterministic ZIP)
        run: npm run pack:juce
      - name: Check out JUCE ${{ env.JUCE_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_COMMIT }}
          path: _deps/JUCE
          persist-credentials: false
      - name: Verify JUCE version
        shell: bash
        run: grep -q "project(JUCE VERSION ${JUCE_VERSION} " _deps/JUCE/CMakeLists.txt
      - name: Cache WebView2 SDK
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuget
          key: webview2-${{ env.WEBVIEW2_VERSION }}
      # Build-time only: headers and WebView2LoaderStatic.lib from the NuGet package. End users
      # need the Microsoft Edge WebView2 Runtime (preinstalled on current Windows 10/11).
      - name: Install WebView2 SDK (NuGet)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'nuget'
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory $out -NonInteractive
          Get-ChildItem $out
      - name: Configure
        shell: bash
        run: >
          cmake -S examples/juce-plugin -B build/juce-ci
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_SOURCE_DIR="${{ github.workspace }}/_deps/JUCE"
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/nuget"
          -DLQ_SURFACE_WEBVIEW_SMOKE_TEST=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
      - name: Build plug-in and native tests
        run: cmake --build build/juce-ci --config Release --parallel 4
      - name: Headless native tests
        run: ctest --test-dir build/juce-ci -C Release --output-on-failure --label-exclude gui
      # Off-screen WKWebView end-to-end check. Informational until it has proven stable on
      # hosted runners.
      - name: WebView smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: ctest --test-dir build/juce-ci -C Release --output-on-failure --label-regex gui
      - name: Inspect bundles (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "build/juce-ci/LqSurfaceExample_artefacts/Release"
          for bundle in "AU/lq-surface example.component" "VST3/lq-surface example.vst3"; do
            test -f "$bundle/Contents/Info.plist"
            plutil -lint "$bundle/Contents/Info.plist"
            lipo -info "$bundle/Contents/MacOS/lq-surface example"
          done
          test -f "VST3/lq-surface example.vst3/Contents/Resources/moduleinfo.json"
      - name: Verify frozen plug-in identity (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "build/juce-ci/LqSurfaceExample_artefacts/Release"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$2/Contents/Info.plist"; }
          check() { if [ "$2" != "$3" ]; then echo "::error::$1 is '$2', expected '$3'"; exit 1; fi; echo "ok  $1 = $2"; }
          AU="AU/lq-surface example.component"; VST3="VST3/lq-surface example.vst3"
          check "AU bundle id"     "$(pb CFBundleIdentifier "$AU")"                "$EXPECT_BUNDLE_ID"
          check "VST3 bundle id"   "$(pb CFBundleIdentifier "$VST3")"              "$EXPECT_BUNDLE_ID"
          check "AU type"          "$(pb AudioComponents:0:type "$AU")"            "$EXPECT_AU_TYPE"
          check "AU subtype"       "$(pb AudioComponents:0:subtype "$AU")"         "$EXPECT_AU_SUBTYPE"
          check "AU manufacturer"  "$(pb AudioComponents:0:manufacturer "$AU")"    "$EXPECT_AU_MANUFACTURER"
          info="$VST3/Contents/Resources/moduleinfo.json"
          grep -q "\"CID\": \"$EXPECT_VST3_PROCESSOR_CID\"" "$info"  && echo "ok  VST3 processor CID"  || { echo "::error::VST3 processor CID changed"; exit 1; }
          grep -q "\"CID\": \"$EXPECT_VST3_CONTROLLER_CID\"" "$info" && echo "ok  VST3 controller CID" || { echo "::error::VST3 controller CID changed"; exit 1; }
      - name: Inspect bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -R "build/juce-ci/LqSurfaceExample_artefacts/Release/VST3"
          test -f "build/juce-ci/LqSurfaceExample_artefacts/Release/VST3/lq-surface example.vst3/Contents/x86_64-win/lq-surface example.vst3"
      - name: Verify frozen plug-in identity (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          info="build/juce-ci/LqSurfaceExample_artefacts/Release/VST3/lq-surface example.vst3/Contents/Resources/moduleinfo.json"
          grep -q "\"CID\": \"$EXPECT_VST3_PROCESSOR_CID\"" "$info"  && echo "ok  VST3 processor CID"  || { echo "::error::VST3 processor CID changed"; exit 1; }
          grep -q "\"CID\": \"$EXPECT_VST3_CONTROLLER_CID\"" "$info" && echo "ok  VST3 controller CID" || { echo "::error::VST3 controller CID changed"; exit 1; }
      # Validators. These run only on the disposable CI runner; nothing is uploaded or published,
      # and compiled example plug-ins are never distributed (docs/licensing.md).
      - name: Download pluginval (pinned, checksum-verified)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then f=pluginval_macOS.zip; sum="$PLUGINVAL_SHA256_MACOS"; else f=pluginval_Windows.zip; sum="$PLUGINVAL_SHA256_WINDOWS"; fi
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$f"
          # Hash from stdin: GNU sha256sum prefixes its output with a backslash when the path contains one (Windows).
          if command -v sha256sum >/dev/null; then actual=$(sha256sum < "$RUNNER_TEMP/$f" | cut -d' ' -f1); else actual=$(shasum -a 256 < "$RUNNER_TEMP/$f" | cut -d' ' -f1); fi
          if [ "$actual" != "$sum" ]; then echo "::error::pluginval checksum mismatch: $actual"; exit 1; fi
          unzip -q -o "$RUNNER_TEMP/$f" -d "$RUNNER_TEMP/pluginval"
          if [ "$RUNNER_OS" = macOS ]; then echo "PLUGINVAL=$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"; else echo "PLUGINVAL=$RUNNER_TEMP/pluginval/pluginval.exe" >> "$GITHUB_ENV"; fi
      - name: pluginval VST3 (strictness 10, GUI tests on)
        shell: bash
        run: >
          "$PLUGINVAL" --strictness-level 10 --timeout-ms 300000
          --validate "build/juce-ci/LqSurfaceExample_artefacts/Release/VST3/lq-surface example.vst3"
      - name: Install AU on the runner (macOS, disposable)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto "build/juce-ci/LqSurfaceExample_artefacts/Release/AU/lq-surface example.component" ~/Library/Audio/Plug-Ins/Components/"lq-surface example.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: auval -strict (macOS)
        if: runner.os == 'macOS'
        run: auval -strict -v "$EXPECT_AU_TYPE" "$EXPECT_AU_SUBTYPE" "$EXPECT_AU_MANUFACTURER"
      - name: pluginval AU (strictness 10, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: >
          "$PLUGINVAL" --strictness-level 10 --timeout-ms 300000
          --validate "$HOME/Library/Audio/Plug-Ins/Components/lq-surface example.component"
