name: Bug report
description: Report a reproducible bug (not a security vulnerability)
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Expected and actual behaviour
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser/DAW, JUCE, Node version
