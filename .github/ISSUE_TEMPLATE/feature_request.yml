    id: problem
    attributes:
      label: Problem or use case
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: constraints
    attributes:
      label: Accessibility, compatibility or test considerations
